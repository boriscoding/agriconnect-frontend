<div class="main-wrapper">
  
  <div class="welcome-container" *ngIf="currentState === 'welcome'" @fadeSlide>
   

    <div class="card welcome-card">
      <div class="logo-circle">
        <img src="assets/images/loagri.png"  alt="Agriconnect">
      </div>
      <h2>BIENVENUE SUR<br><span>Agriconnect</span></h2>
      
      <div class="button-group">
        <button (click)="navigateTo('signup')" class="btn-signup">CRÉER UN COMPTE</button>
        <button (click)="navigateTo('connect')" class="btn-connect">SE CONNECTER</button>
      </div>

      <div class="social-icons">
        <i class="fab fa-google"></i>
        <i class="fab fa-facebook"></i>
        <i class="fab fa-instagram"></i>
      </div>
    </div>
  </div>

  <div class="form-container" *ngIf="currentState !== 'welcome'" @fadeSlide>
    <app-formconnect *ngIf="currentState === 'connect'"></app-formconnect>
    <app-formsignup *ngIf="currentState === 'signup'"></app-formsignup>
<div [@fadeSlide] *ngIf="currentState === 'connect'">
  <app-formconnect (backToHome)="navigateTo('welcome')"></app-formconnect>
</div>

<div [@fadeSlide] *ngIf="currentState === 'signup'">
  <app-formsignup (backToHome)="navigateTo('welcome')"></app-formsignup>
</div>
  </div>

</div>
