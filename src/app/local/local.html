<div class="app-layout">
  <aside class="sidebar">
    <div class="speed-section">
      <div class="speed-circle">
        <span class="value">{{ (gps.speed$ | async) || 0 }}</span>
        <span class="label">km/h</span>
      </div>
    </div>

    <div class="mode-section">
      <h3>Mode de transport</h3>
      <div class="mode-grid">
        <button *ngFor="let mode of modes" 
                [class.active]="activeMode === mode"
                (click)="setMode(mode)" class="btn-mode">
          {{ mode }}
        </button>
      </div>
    </div>

    <div class="main-actions">
      <button class="btn btn-start" (click)="gps.startTracking()">DÉMARRER</button>
      <button class="btn btn-stop" (click)="gps.stopTracking()">ARRÊTER</button>
    </div>
  </aside>

  <main class="map-wrapper">
    <div id="map"></div>

    <div class="hud-stats">
      <div class="hud-card">
        <span class="hud-label">Altitude</span>
        <span class="hud-value">{{ (gps.altitude$ | async) || 0 }} m</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Distance</span>
        <span class="hud-value">{{ (gps.distance$ | async)?.toFixed(2) || 0 }} km</span>
      </div>
      <div class="hud-card">
        <span class="hud-label">Statut</span>
        <span class="hud-value status" [style.color]="(gps.status$ | async) === 'Actif' ? '#00c853' : '#ff9100'">
          {{ gps.status$ | async }}
        </span>
      </div>
    </div>
  </main>
</div>
